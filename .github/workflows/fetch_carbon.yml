name: Automated Carbon Data Sync
#this is used for getting new variable values from api
on: #this make this run every hour
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch: {}

#giving perms so teh bot can send data to code
permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Make data directory if missing
        run: mkdir -p data

      - name: Fetch Live Grid Intensities from API
        env:
          API_KEY: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}  #the data is requested for the zones below
        run: |
          for zone in IN IN-EA IN-NE IN-NO IN-SO IN-WE; do
            echo "Syncing live metrics for $zone..."
            curl -s -X GET "https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=${zone}" \
                 -H "auth-token: ${API_KEY}" > "data/${zone}.json"
            sleep 1
          done
#puhes the data gotten by api
      - name: Commit and Push Updated Live Data
        run: |
          git config --global user.name "CodeGreens Data Bot"
          git config --global user.email "bot@codegreens.local"
          git add data/*.json
          
          if git diff --staged --quiet; then
            echo "no data adjustments recorded."
          else
            git commit -m "sync live data metrics"
            git push
          fi
